<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiempo Kindle</title><style>
body{margin:0;background:#fff;color:#000;font:16px Arial,sans-serif}main{max-width:760px;margin:auto;padding:10px}button{background:#fff;color:#000;border:1px solid #000;padding:7px 6px;margin:2px;font:inherit}.sel{font-weight:bold;text-decoration:underline;border:2px solid #000}h1{font-size:20px;margin:10px 0 4px}h2{font-size:17px;border-bottom:1px solid #000;margin:14px 0 4px}.bar{border-bottom:1px solid #000;padding-bottom:6px}.controls{margin:8px 0}.status{font-weight:bold}.row{display:table;width:100%;table-layout:fixed;border-bottom:1px solid #aaa;padding:5px 0}.row span{display:table-cell}.row span:nth-child(1){width:12%}.row span:nth-child(2){width:29%}.row span:nth-child(3){width:13%}.row span:nth-child(4){width:19%}.row span:nth-child(5){width:27%}.head{font-weight:bold;border-top:1px solid #000;border-bottom:2px solid #000}.day{font-weight:bold;text-transform:capitalize;border-bottom:2px solid #000;padding:8px 2px 5px}p{line-height:1.45;margin:5px 0}footer{border-top:1px solid #000;margin-top:12px;padding-top:6px;font-size:12px}@media(max-width:520px){body{font-size:14px}button{padding:5px 4px}h1{font-size:17px}.row{font-size:12px}}
</style></head><body><main><div id="cities" class="bar"></div><h1 id="title">EL TIEMPO - PRÓXIMAS 48 HORAS</h1><p>Ciudad: <b><u id="cityName">Cáceres</u></b><br>Actualizado: <span id="stamp">--</span><br>Fuente: <span id="source">--</span></p><div class="controls"><button onclick="loadData()">ACTUALIZAR</button><button id="modeTop" onclick="toggleMode()">AMPLIAR</button></div><p id="status" class="status">Cargando datos...</p><div id="content"></div><div class="controls"><button onclick="loadData()">ACTUALIZAR</button><button id="modeBottom" onclick="toggleMode()">AMPLIAR</button></div><footer>Fuentes: <a href="https://open-meteo.com/">Open-Meteo</a> y <a href="https://api.met.no/">MET Norway</a>.</footer></main><script>
var cities={"Cáceres":[39.4753,-6.3724],"Madrid":[40.4168,-3.7038],"Málaga":[36.7213,-4.4214],"Monroy":[39.6377,-6.2138],"Sevilla":[37.3891,-5.9845]},city="Cáceres",mode=1,data=null,air=null,loadId=0,results={};
function E(x){return document.getElementById(x)}function drawCities(){var h='',n;for(n in cities)h+='<button'+(n===city?' class="sel"':'')+' onclick="selectCity(\''+n+'\')">'+n+'</button>';E('cities').innerHTML=h}function selectCity(n){city=n;E('cityName').innerHTML=n;drawCities();loadData()}
function skyW(c){if(c===0)return'Despejado';if(c===1)return'Casi despejado';if(c===2)return'Poco nuboso';if(c===3)return'Cubierto';if(c===45||c===48)return'Niebla';if(c>=51&&c<=57)return'Llovizna';if((c>=61&&c<=67)||(c>=80&&c<=82))return'Lluvia';if((c>=71&&c<=77)||(c>=85&&c<=86))return'Nieve';if(c>=95)return'Tormenta';return'Variable'}
function skyM(s){s=s||'';if(s.indexOf('clear')>=0)return'Despejado';if(s.indexOf('fair')>=0)return'Casi despejado';if(s.indexOf('partlycloudy')>=0)return'Poco nuboso';if(s.indexOf('cloudy')>=0)return'Cubierto';if(s.indexOf('fog')>=0)return'Niebla';if(s.indexOf('thunder')>=0)return'Tormenta';if(s.indexOf('snow')>=0||s.indexOf('sleet')>=0)return'Nieve';if(s.indexOf('rain')>=0||s.indexOf('drizzle')>=0)return'Lluvia';return'Variable'}function dir(d){var p=['N','NE','E','SE','S','SO','O','NO'];return p[Math.round((d||0)/45)%8]}function dec(v){return v==null||isNaN(Number(v))?'N/D':Number(v).toFixed(1).replace('.',',')}
function get(url,ok,bad){var x=new XMLHttpRequest(),end=false;x.onreadystatechange=function(){if(x.readyState===4&&!end){end=true;if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText))}catch(e){bad()}}else bad()}};x.onerror=x.ontimeout=function(){if(!end){end=true;bad()}};x.open('GET',url,true);x.timeout=6000;x.send()}
function get3(url,ok,bad,n){n=n||1;get(url,ok,function(){if(n<3)setTimeout(function(){get3(url,ok,bad,n+1)},500);else bad()})}
function localISO(d){function z(n){return('0'+n).slice(-2)}return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':00'}
function normOM(w){var a=[],i;for(i=0;i<w.hourly.time.length&&i<48;i++)a.push({time:w.hourly.time[i],temp:w.hourly.temperature_2m[i],prob:w.hourly.precipitation_probability[i],rain:w.hourly.precipitation[i],sky:skyW(w.hourly.weather_code[i]),wind:w.hourly.wind_speed_10m[i],wd:w.hourly.wind_direction_10m[i]});return{hours:a,current:w.current,source:'Open-Meteo',saved:new Date().getTime()}}
function normMET(m){var ts=m.properties.timeseries,a=[],i,o,d,next,det,inst;for(i=0;i<ts.length&&a.length<48;i++){d=new Date(ts[i].time);if(d.getTime()<new Date().getTime()-3600000)continue;o=ts[i].data;inst=o.instant.details;next=o.next_1_hours||o.next_6_hours||{};det=next.details||{};a.push({time:localISO(d),temp:inst.air_temperature,prob:null,rain:det.precipitation_amount,sky:skyM(next.summary?next.summary.symbol_code:''),wind:inst.wind_speed*3.6,wd:inst.wind_from_direction})}return{hours:a,current:{temperature_2m:a[0]?a[0].temp:null,relative_humidity_2m:ts[0].data.instant.details.relative_humidity,apparent_temperature:null,precipitation:a[0]?a[0].rain:null,cloud_cover:ts[0].data.instant.details.cloud_area_fraction,surface_pressure:ts[0].data.instant.details.air_pressure_at_sea_level,wind_speed_10m:a[0]?a[0].wind:null,wind_direction_10m:a[0]?a[0].wd:null,wind_gusts_10m:null},source:'MET Norway',saved:new Date().getTime()}}
function loadData(){var id=++loadId,p=cities[city],lat=p[0],lon=p[1];results={};E('status').innerHTML='Actualizando...';var f='temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m',c='temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m';var om='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&hourly='+f+'&current='+c+'&forecast_hours=48&timezone=Europe%2FMadrid';var met='https://api.met.no/weatherapi/locationforecast/2.0/compact?lat='+lat+'&lon='+lon;get3(om,function(w){if(id!==loadId)return;results.om=normOM(w);choose(id)},function(){results.om=false;choose(id)});get3(met,function(m){if(id!==loadId)return;results.met=normMET(m);choose(id)},function(){results.met=false;choose(id)});loadAir(id,lat,lon)}
function choose(id){if(id!==loadId)return;if(results.om){use(results.om);return}if(results.met){use(results.met);return}if(results.om===false&&results.met===false){var old=readCache();if(old){data=old;E('source').innerHTML=old.source+' (últimos datos guardados)';E('status').innerHTML='Sin conexión: se muestran los últimos datos disponibles.';render()}else E('status').innerHTML='No se pudieron recuperar datos de ninguna fuente tras 3 intentos.'}}
function use(d){data=d;try{localStorage.setItem('tk_'+city,JSON.stringify(d))}catch(e){}setStamp();E('source').innerHTML=d.source;E('status').innerHTML='';render()}
function readCache(){try{return JSON.parse(localStorage.getItem('tk_'+city))}catch(e){return null}}
function loadAir(id,lat,lon){var u='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lon+'&current=european_aqi,pm10,pm2_5,nitrogen_dioxide,ozone,sulphur_dioxide,uv_index&timezone=Europe%2FMadrid';get3(u,function(q){if(id===loadId){air=q;if(mode===2)renderDetail()}},function(){air=null})}
function setStamp(){var d=new Date();E('stamp').innerHTML=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}function toggleMode(){mode=mode===1?2:1;render()}function render(){var t=E('modeTop'),b=E('modeBottom');if(mode===1){E('title').innerHTML='EL TIEMPO - PRÓXIMAS 48 HORAS';t.innerHTML=b.innerHTML='AMPLIAR';render48()}else{E('title').innerHTML='SITUACIÓN METEOROLÓGICA ACTUAL';t.innerHTML=b.innerHTML='VOLVER A 48 HORAS';renderDetail()}}
function dateTitle(t){var a=t.substring(0,10).split('-'),d=new Date(+a[0],+a[1]-1,+a[2]),ds=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],ms=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return ds[d.getDay()]+' '+d.getDate()+' de '+ms[d.getMonth()]+' de '+d.getFullYear()}
function render48(){if(!data)return;var h='<div class="row head"><span>Hora</span><span>Cielo</span><span>Temp.</span><span>Lluvia</span><span>Viento</span></div>',i,x,last='',pr;for(i=0;i<data.hours.length;i++){x=data.hours[i];if(x.time.substring(0,10)!==last){last=x.time.substring(0,10);h+='<div class="day">'+dateTitle(x.time)+'</div>'}pr=x.prob==null?'N/D':x.prob+'%';h+='<div class="row"><span>'+x.time.substring(11,16)+'</span><span>'+x.sky+'</span><span>'+Math.round(x.temp)+'°</span><span>'+pr+' / '+dec(x.rain)+' mm</span><span>'+dir(x.wd)+' '+Math.round(x.wind)+' km/h</span></div>'}E('content').innerHTML=h}
function val(o,k,u){return o&&o[k]!=null?o[k]+(u||''):'N/D'}function renderDetail(){if(!data)return;var c=data.current,q=air?air.current:null,h='<h2>Cielo y radiación</h2><p>Nubosidad: '+val(c,'cloud_cover','%')+'<br>Índice UV: '+val(q,'uv_index','')+'</p><h2>Datos atmosféricos</h2><p>Presión: '+val(c,'surface_pressure',' hPa')+'<br>Viento: '+dir(c.wind_direction_10m)+' '+val(c,'wind_speed_10m',' km/h')+'<br>Rachas: '+val(c,'wind_gusts_10m',' km/h')+'</p><h2>Condiciones térmicas</h2><p>Temperatura: '+val(c,'temperature_2m',' °C')+'<br>Sensación: '+val(c,'apparent_temperature',' °C')+'</p><h2>Precipitaciones y humedad</h2><p>Precipitación: '+val(c,'precipitation',' mm')+'<br>Humedad: '+val(c,'relative_humidity_2m','%')+'</p><h2>Calidad del aire y salud</h2><p>Índice europeo: '+val(q,'european_aqi','')+'<br>PM2.5: '+val(q,'pm2_5',' µg/m³')+'<br>PM10: '+val(q,'pm10',' µg/m³')+'<br>NO2: '+val(q,'nitrogen_dioxide',' µg/m³')+'<br>O3: '+val(q,'ozone',' µg/m³')+'</p>';E('content').innerHTML=h}
drawCities();loadData();
</script></body></html>
