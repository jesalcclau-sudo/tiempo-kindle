<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiempo Kindle</title>
<style>
body{margin:0;background:#fff;color:#000;font-family:Arial,sans-serif;font-size:16px}main{max-width:760px;margin:auto;padding:10px}button{background:#fff;color:#000;border:1px solid #000;padding:7px 6px;margin:2px;font:inherit}.sel{font-weight:bold;text-decoration:underline;border:2px solid #000}h1{font-size:20px;margin:10px 0 4px}h2{font-size:17px;border-bottom:1px solid #000;margin:14px 0 4px}.bar{border-bottom:1px solid #000;padding-bottom:6px}.controls{margin:8px 0}.status{font-weight:bold}.row{display:table;width:100%;table-layout:fixed;border-bottom:1px solid #aaa;padding:5px 0}.row span{display:table-cell;vertical-align:top}.row span:nth-child(1){width:12%}.row span:nth-child(2){width:31%}.row span:nth-child(3){width:13%}.row span:nth-child(4){width:14%}.row span:nth-child(5){width:30%}.head{font-weight:bold;border-top:1px solid #000;border-bottom:2px solid #000}.day{font-weight:bold;text-transform:capitalize;border-bottom:2px solid #000;padding:8px 2px 5px;margin-top:2px}p{line-height:1.45;margin:5px 0}footer{border-top:1px solid #000;margin-top:12px;padding-top:6px;font-size:12px}@media(max-width:520px){body{font-size:14px}button{padding:5px 4px}h1{font-size:17px}.row{font-size:12px}}
</style>
</head>
<body><main>
<div id="cities" class="bar"></div>
<h1 id="title">EL TIEMPO - PRÓXIMAS 48 HORAS</h1>
<p>Ciudad: <b><u id="cityName">Cáceres</u></b><br>Actualizado: <span id="stamp">--</span></p>
<div class="controls"><button onclick="loadData()">ACTUALIZAR</button><button id="modeTop" onclick="toggleMode()">AMPLIAR</button></div>
<p id="status" class="status">Cargando datos...</p>
<div id="content"></div>
<div class="controls"><button onclick="loadData()">ACTUALIZAR</button><button id="modeBottom" onclick="toggleMode()">AMPLIAR</button></div>
<footer>Datos meteorológicos: <a href="https://open-meteo.com/">Open-Meteo</a>.</footer>
</main>
<script>
var cities={"Cáceres":[39.4753,-6.3724],"Madrid":[40.4168,-3.7038],"Málaga":[36.7213,-4.4214],"Monroy":[39.6377,-6.2138],"Sevilla":[37.3891,-5.9845]};
var city="Cáceres",mode=1,weather=null,air=null;
function byId(x){return document.getElementById(x)}
function drawCities(){var h="",n;for(n in cities)h+='<button'+(n===city?' class="sel"':'')+' onclick="selectCity(\''+n.replace("'","\\'")+'\')">'+n+'</button>';byId('cities').innerHTML=h}
function selectCity(n){city=n;byId('cityName').innerHTML=n;drawCities();loadData()}
function sky(c){if(c===0)return'Despejado';if(c===1)return'Casi despejado';if(c===2)return'Poco nuboso';if(c===3)return'Cubierto';if(c===45||c===48)return'Niebla';if(c>=51&&c<=57)return'Llovizna';if((c>=61&&c<=67)||(c>=80&&c<=82))return'Lluvia';if((c>=71&&c<=77)||(c>=85&&c<=86))return'Nieve';if(c>=95)return'Tormenta';return'Variable'}
function dir(d){var p=['N','NE','E','SE','S','SO','O','NO'];return p[Math.round((d||0)/45)%8]}
function xhr(url,done,fail){var x=new XMLHttpRequest();x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300){try{done(JSON.parse(x.responseText))}catch(e){fail()}}else fail()}};x.open('GET',url,true);x.send()}
function loadData(){byId('status').innerHTML='Actualizando...';var p=cities[city],lat=p[0],lon=p[1];var u='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m&forecast_hours=48&timezone=Europe%2FMadrid';xhr(u,function(w){weather=w;var a='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lon+'&current=european_aqi,pm10,pm2_5,nitrogen_dioxide,ozone,sulphur_dioxide,carbon_monoxide,uv_index&timezone=Europe%2FMadrid';xhr(a,function(q){air=q;finish()},function(){air=null;finish()})},function(){byId('status').innerHTML='No se pudieron obtener los datos. Pulse ACTUALIZAR.'})}
function finish(){var d=new Date();byId('stamp').innerHTML=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);byId('status').innerHTML='';render()}
function toggleMode(){mode=mode===1?2:1;render()}
function render(){var b1=byId('modeTop'),b2=byId('modeBottom');if(mode===1){byId('title').innerHTML='EL TIEMPO - PRÓXIMAS 48 HORAS';b1.innerHTML=b2.innerHTML='AMPLIAR';render48()}else{byId('title').innerHTML='SITUACIÓN METEOROLÓGICA ACTUAL';b1.innerHTML=b2.innerHTML='VOLVER A 48 HORAS';renderDetail()}}
function dateTitle(t){var a=t.substring(0,10).split('-'),d=new Date(Number(a[0]),Number(a[1])-1,Number(a[2]));var days=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return days[d.getDay()]+' '+d.getDate()+' de '+months[d.getMonth()]+' de '+d.getFullYear()}
function render48(){if(!weather)return;var h='<div class="row head"><span>Hora</span><span>Cielo</span><span>Temp.</span><span>Lluvia</span><span>Viento</span></div>',i,t,last='';for(i=0;i<weather.hourly.time.length&&i<48;i++){t=weather.hourly.time[i];var day=t.substring(0,10);if(day!==last){h+='<div class="day">'+dateTitle(t)+'</div>';last=day}h+='<div class="row"><span>'+t.substring(11,16)+'</span><span>'+sky(weather.hourly.weather_code[i])+'</span><span>'+Math.round(weather.hourly.temperature_2m[i])+'°</span><span>'+weather.hourly.precipitation_probability[i]+'%</span><span>'+dir(weather.hourly.wind_direction_10m[i])+' '+Math.round(weather.hourly.wind_speed_10m[i])+' km/h</span></div>'}byId('content').innerHTML=h}
function val(o,k,u){return o&&o[k]!=null?o[k]+(u||''):'N/D'}
function renderDetail(){if(!weather)return;var c=weather.current,q=air?air.current:null;var h='<h2>Cielo y radiación</h2><p>Cielo: <b>'+sky(c.weather_code)+'</b><br>Nubosidad: '+val(c,'cloud_cover','%')+'<br>Índice UV: '+val(q,'uv_index','')+'</p>';h+='<h2>Datos atmosféricos</h2><p>Presión: '+val(c,'surface_pressure',' hPa')+'<br>Viento: '+dir(c.wind_direction_10m)+' '+val(c,'wind_speed_10m',' km/h')+'<br>Rachas: '+val(c,'wind_gusts_10m',' km/h')+'</p>';h+='<h2>Condiciones térmicas</h2><p>Temperatura: '+val(c,'temperature_2m',' °C')+'<br>Sensación: '+val(c,'apparent_temperature',' °C')+'</p>';h+='<h2>Precipitaciones y humedad</h2><p>Precipitación: '+val(c,'precipitation',' mm')+'<br>Humedad: '+val(c,'relative_humidity_2m','%')+'</p>';h+='<h2>Calidad del aire y salud</h2><p>Índice europeo: '+val(q,'european_aqi','')+'<br>PM2.5: '+val(q,'pm2_5',' µg/m³')+'<br>PM10: '+val(q,'pm10',' µg/m³')+'<br>NO2: '+val(q,'nitrogen_dioxide',' µg/m³')+'<br>O3: '+val(q,'ozone',' µg/m³')+'<br>SO2: '+val(q,'sulphur_dioxide',' µg/m³')+'</p>';byId('content').innerHTML=h}
drawCities();loadData();
</script></body></html>
